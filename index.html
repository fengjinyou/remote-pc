<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>webrc</title>
<style>
  :root { --bar: 46px; }
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; overscroll-behavior: none; }
  #stage { position: fixed; left: 0; right: 0; top: 0; bottom: var(--bar); display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: none; }
  #cv { max-width: 100%; max-height: 100%; cursor: crosshair; background: #000; transform-origin: 0 0; will-change: transform; }
  #rc { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform; }  /* 远端光标：单独一层，不画进画布 */
  #rc svg { display: block; }
  #zhud { position: absolute; right: 8px; top: 8px; padding: 2px 7px; border-radius: 10px; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; pointer-events: none; }
  #overlay { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,.75); padding: 10px 16px; border-radius: 8px; pointer-events: none; box-sizing: border-box; width: max-content; max-width: calc(100vw - 32px); text-align: center; line-height: 1.5; }
  #overlay:empty { display: none; }
  #kb { position: fixed; left: 0; bottom: var(--bar); width: 2px; height: 2px; opacity: .01; border: 0; padding: 0; resize: none; outline: none; pointer-events: none; }  /* 只用来收键盘事件，不当点击目标 */
  #bar { position: fixed; left: 0; right: 0; bottom: 0; height: var(--bar); box-sizing: border-box; display: flex; align-items: center; gap: 4px; padding: 0 6px; overflow-x: auto; background: #222; white-space: nowrap; scrollbar-width: none; }
  #bar::-webkit-scrollbar { display: none; }
  #bar button, #bar select { flex: none; height: 32px; min-width: 36px; padding: 0 8px; border: 0; border-radius: 6px; background: #3a3a3a; color: #eee; font: inherit; }
  #bar button.on { background: #2f80ed; }
  #bar [hidden] { display: none; }
  #st { flex: none; margin-left: auto; padding-left: 8px; font-size: 12px; color: #999; }
</style>
</head>
<body>
<div id="stage"><canvas id="cv" width="16" height="9"></canvas><div id="rc" hidden><svg width="13" height="20" viewBox="-1 -1 13 20" aria-hidden="true"><path d="M0 0V16L4 12L7 18L9.5 17L6.5 11H11Z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg></div><div id="overlay">连接中…</div><div id="zhud" hidden></div></div>
<textarea id="kb" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="键盘输入"></textarea>
<div id="bar">
  <button data-act="kb" title="弹出 / 收起手机软键盘（亮着＝键盘正开着）">⌨</button>
  <button data-mod="Control">Ctrl</button><button data-mod="Alt">Alt</button><button data-mod="Shift">Shift</button><button data-mod="Meta">Win</button>
  <button data-key="Escape">Esc</button><button data-key="Tab">Tab</button><button data-key="Enter">↵</button><button data-key="Backspace">⌫</button><button data-key="Delete">Del</button>
  <button data-key="ArrowLeft">←</button><button data-key="ArrowUp">↑</button><button data-key="ArrowDown">↓</button><button data-key="ArrowRight">→</button>
  <select id="codec" title="编码：H.264 流量小、看视频流畅（需要被控端有 ffmpeg）；JPEG 不依赖任何东西">
    <option value="h264">H.264</option>
    <option value="jpeg">JPEG</option>
  </select>
  <select id="kbps" title="H.264 码率上限（中继出口带宽是硬顶，别超过它）">
    <option value="1000">1M</option>
    <option value="2000">2M</option>
    <option value="3000">3M</option>
    <option value="5000">5M</option>
    <option value="8000" selected>8M</option>
  </select>
  <select id="q" title="分辨率宽度 / JPEG 质量">
    <option value="0,75" selected>原始尺寸</option>
    <option value="1920,70">1920</option>
    <option value="1600,65">1600</option>
    <option value="1280,60">1280</option>
    <option value="960,45">960 省流</option>
  </select>
  <select id="fps" title="帧率上限"><option value="30" selected>30fps</option><option value="20">20fps</option><option value="15">15fps</option><option value="12">12fps</option><option value="8">8fps</option><option value="5">5fps</option></select>
  <select id="pc" hidden title="控制哪台电脑（一个中继挂了好几台时才出现）"></select>
  <select id="mon" hidden title="看哪个屏幕（被控端有多个显示器时才出现；所有观众看同一个）"></select>
  <button data-act="zo" title="缩小">−</button><button id="zoom" data-act="zr" title="当前缩放，点一下回到 1×。手机：双指捏合缩放，放大后单指拖动画面、双指滑动滚页面，双指连点两下放大 / 复原；电脑：触控板捏合，放大后鼠标顶到边缘自动挪">1×</button><button data-act="zi" title="放大">+</button>
  <button data-act="fs">全屏</button>
  <span id="st"></span>
</div>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d', { alpha: false }), kb = $('kb'), overlay = $('overlay'), st = $('st'), bar = $('bar'), stage = $('stage'), zhud = $('zhud'), rc = $('rc');
const token = new URLSearchParams(location.search).get('token') || '';
const SENT = '\u200b';   // 输入框里常驻一个零宽空格：这样手机软键盘的退格也能被捕获到
const MODS = new Set(['Shift', 'Control', 'Alt', 'Meta', 'OS']);
const SPECIAL = new Set([...MODS, 'Enter', 'Backspace', 'Tab', 'Escape', 'Delete', 'Insert', 'Home', 'End', 'PageUp', 'PageDown',
  'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'CapsLock', 'NumLock', 'ScrollLock', 'ContextMenu', 'PrintScreen', 'Pause',
  'F1', 'F2', 'F3', 'F4', 'F5', 'F6', 'F7', 'F8', 'F9', 'F10', 'F11', 'F12']);
const HAS_H264 = typeof VideoDecoder === 'function';   // WebCodecs：Chrome/Edge 94+、Safari 16.4+、Firefox 130+，且要 https 或 localhost

let ws = null, agentOnline = false, synced = false, cur = null, codecName = '';
let curPc = null, pcSig = '', autoPick = false;   // 当前控的是哪台被控电脑（中继的 {t:'pc'} 说了算）
const urlPc = new URLSearchParams(location.search).get('pc') || '';
const lastPc = () => { try { return localStorage.getItem('webrc.pc') || ''; } catch (_) { return ''; } };
const rememberPc = n => { try { localStorage.setItem('webrc.pc', n); } catch (_) { /* 隐私模式下会抛，无所谓 */ } };
const stats = { frames: 0, bytes: 0, strips: 0, t: performance.now(), rtt: null };
const pressed = new Set();   // 通过 key 事件按下、还没松开的键
const mods = new Set();      // 工具栏点亮的一次性修饰键（下一个动作用完自动松开）

const send = obj => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); };
const setOverlay = text => { overlay.textContent = text; };

// 默认就给下拉框里最好的一档：原始分辨率 + 30fps + 8M 码率（手机电脑一样）。
// 中继出口带宽是硬顶，卡了就先降 kbps，再降分辨率——两个都在工具栏上，改完立刻生效。
if (!HAS_H264) { $('codec').value = 'jpeg'; $('codec').querySelector('[value=h264]').disabled = true; }
// 工具栏上改过的编码 / 码率 / 分辨率 / 帧率记在本机（手机、电脑各记各的），下次打开照旧，不用每次重选；
// 自动降级（H.264 解不出来改 JPEG）不记，下次还先试 H.264
const CFG = ['codec', 'kbps', 'q', 'fps'];
try {
  const saved = JSON.parse(localStorage.getItem('webrc.cfg') || '{}');
  for (const id of CFG) if ([...$(id).options].some(o => o.value === saved[id] && !o.disabled)) $(id).value = saved[id];
} catch (_) { /* 隐私模式 / 存的东西坏了：用默认 */ }
const saveCfg = () => { try { localStorage.setItem('webrc.cfg', JSON.stringify(Object.fromEntries(CFG.map(id => [id, $(id).value])))); } catch (_) { /* ignore */ } };
$('kbps').hidden = $('codec').value !== 'h264';

// ---------- 连接 ----------
let chain = Promise.resolve();   // 帧必须按顺序画（增量帧叠在前一帧上），所以串成一条链
let retryTimer = 0, hideTimer = 0, lastRx = 0;
function connect() {
  clearTimeout(retryTimer); retryTimer = 0;
  if (document.hidden) return;   // 在后台就先不连，回到前台 visibilitychange 会马上连
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const want = curPc || urlPc || lastPc();   // 刷新、断线重连都回到上次那台；都没有就交给中继挑一台在线的
  // 每条连接的回调都先核对自己还是不是当前连接：主动换掉的旧连接晚到的 close / 帧一律不理，免得重复重连、把旧帧的回执记到新连接上
  const sock = ws = new WebSocket(`${proto}://${location.host}/ws?token=${encodeURIComponent(token)}` + (want ? `&pc=${encodeURIComponent(want)}` : ''));
  sock.binaryType = 'arraybuffer';
  lastRx = performance.now();
  sock.onopen = () => { if (sock !== ws) return; synced = false; autoPick = true; setOverlay(agentOnline ? '等待画面…' : '等待被控端上线…'); sendConfig(); };
  sock.onmessage = e => {
    if (sock !== ws) return;
    lastRx = performance.now();
    if (typeof e.data === 'string') { onText(JSON.parse(e.data)); return; }
    const data = e.data;
    chain = chain.then(() => sock === ws && drawFrame(data)).catch(err => console.warn('frame', err))
      .then(() => { if (sock === ws && sock.readyState === 1) sock.send('{"t":"ack"}'); });
  };
  sock.onclose = () => { if (sock !== ws) return; dropConn(); retryTimer = setTimeout(connect, 1500); };
  sock.onerror = () => { try { sock.close(); } catch (_) { /* ignore */ } };
}
function dropConn(msg) {   // 连接没了（或被我们主动扔掉）：清状态，画面留着，等重连
  ws = null; synced = false; h264Proven = false; closeDecoder(); clearLocal();
  setOverlay(msg || '连接断开，重连中…');
}
function reconnectNow() {
  const old = ws;
  if (old) { dropConn(); try { old.close(); } catch (_) { /* ignore */ } }   // ws 先置空，旧连接的 onclose 就不会再排一次重连
  connect();
}
// 手机锁屏 / 切后台再回来，旧连接常常已经被中继踢了、或者半死不活收不到 close，以前要干等好几秒：
// 回到前台先 ping 一下，1.5 秒内什么都没收到就直接重连。在后台待满 10 秒就主动断开，被控端没人看就停止截屏编码
// （以前后台标签页会一分钟一次地重连、收几秒画面又被踢，被控端日志里 221 次观看有 180 次不到 20 秒）
document.addEventListener('visibilitychange', () => {
  clearTimeout(hideTimer);
  if (document.hidden) {
    releaseAll();
    if (kbWanted) closeKb();                        // 切走时系统已经把软键盘收了；回来要打字再点 ⌨
    hideTimer = setTimeout(() => {
      clearTimeout(retryTimer); retryTimer = 0;
      if (ws) { const old = ws; dropConn('已暂停（页面在后台）'); try { old.close(); } catch (_) { /* ignore */ } }
    }, 10000);
    return;
  }
  if (!ws) { connect(); return; }                     // 在后台时断了、或者被我们暂停了：马上连，不等重连计时
  if (ws.readyState !== 1) return;                    // 正在连，让它连
  const t0 = performance.now();
  send({ t: 'ping', ts: t0 });
  setTimeout(() => { if (!document.hidden && ws && ws.readyState === 1 && lastRx < t0) reconnectNow(); }, 1500);
});
window.addEventListener('pageshow', e => { if (e.persisted) reconnectNow(); });   // 从往返缓存恢复的页面，连接早没了
window.addEventListener('online', () => { if (!ws || ws.readyState > 1) reconnectNow(); });
// 前台兜底：每 2 秒有一次 ping/pong，8 秒什么都没收到就当连接已经死了
setInterval(() => { if (!document.hidden && ws && ws.readyState === 1 && performance.now() - lastRx > 8000) reconnectNow(); }, 1000);
function onText(m) {
  if (m.t === 'agent') {
    agentOnline = !!m.online;
    setOverlay(agentOnline ? (synced ? '' : '等待画面…') : '被控端离线，等它连上中继…');
    if (agentOnline) sendConfig();           // 被控端重启后是它自己的默认设置，把页面上选的再发一遍
    else { synced = false; closeDecoder(); }
  }
  else if (m.t === 'cur') { cur = { x: m.x, y: m.y }; placeCursor(); }
  else if (m.t === 'pong') { stats.rtt = Math.round(performance.now() - m.ts); }
  else if (m.t === 'mons') setMonitors(m);
  else if (m.t === 'pcs') setPcs(m);
  else if (m.t === 'pc') onPc(m.name);
  else if (m.t === 'desk') setLocked(!!m.locked);
  else if (m.t === 'blocked') onBlocked(m);
}
// 以「…」结尾的提示都是过渡状态（等画面、切屏、换解码器），画面一到就清掉
function clearWaiting() { if (overlay.textContent.endsWith('…')) setOverlay(''); }
// 被控端锁屏 / 弹了 UAC 确认框：那是另一个桌面（Winlogon），截不到也点不了。被控端每秒查一次，变了就说一声；
// 不说的话页面只会一直「等待画面…」，看的人只能反复刷新（老版被控端不发这个，照旧干等）
const LOCKED_MSG = '被控端锁屏了（或弹着 UAC 确认框）：远程截不到也点不了，得在那台电脑上解锁';
function setLocked(v) {
  if (v) setOverlay(LOCKED_MSG);
  else if (overlay.textContent === LOCKED_MSG) setOverlay(synced ? '' : '等待画面…');
}
// 被控端的注入被 Windows 丢了（UIPI）：前台是权限更高的窗口（任务管理器、「以管理员身份运行」的程序……），而 agent 不是管理员起的。
// 画面照常、键鼠全进不去。agent 在你点击时会请 explorer 把窗口全最小化（fixed 说成没成），只是移动光标时只说明原因；
// 被挡着期间它每 2 秒说一次，所以提示一直在，松手不动 10 秒后自己消失
let blockedTimer = 0;
function onBlocked(m) {
  const who = m.exe && m.exe !== '?' ? m.exe : (m.win || '未知窗口');
  const msg = `被控端前台是管理员权限的窗口「${who}」，而 agent 不是以管理员身份运行的，键鼠被系统丢弃。` + (
    m.fixed === true ? '已请系统把窗口全部最小化，可以继续了；要操作这类窗口，请以管理员身份重新启动 agent'
      : m.fixed === false ? '尝试最小化也没成功：只能在那台电脑上关掉它，或以管理员身份重新启动 agent'
        : '点一下画面可以让系统把它最小化；要操作这类窗口，请以管理员身份重新启动 agent');
  setOverlay(msg);
  clearTimeout(blockedTimer);
  blockedTimer = setTimeout(() => { if (overlay.textContent === msg) setOverlay(synced ? '' : '等待画面…'); }, m.fixed === true ? 6000 : 10000);
}

// ---------- 电脑切换：一个中继可以同时挂好几台被控电脑。中继在有 agent 上下线、有人进出或切换时广播
// {t:'pcs',list:[{name,online,viewers}]}；你自己现在看的是哪台，由 {t:'pc',name} 单独告诉你。
// 切换只是中继把这个观众从一路挪到另一路，WebSocket 不重连；只挂了一台时不显示下拉框 ----------
function setPcs(m) {
  const sel = $('pc'), list = m.list || [];
  const sig = list.map(o => `${o.name}:${o.online ? 1 : 0}`).join(',');
  if (sig !== pcSig) {          // 名单没变就只同步选中项，别在人家正打开下拉框时重建它
    pcSig = sig;
    sel.innerHTML = '';
    for (const o of list) sel.add(new Option(o.online ? o.name : `${o.name}（离线）`, o.name));
    if (curPc && !list.some(o => o.name === curPc)) sel.add(new Option(`${curPc}（离线）`, curPc));
    sel.hidden = sel.options.length < 2;
  }
  if (curPc) sel.value = curPc;
  // 记住的那台没开机，而恰好只有另一台在线：刚连上、还没看到画面时自己跳过去，省得手动切
  const online = list.filter(o => o.online);
  if (autoPick && !agentOnline && !synced && online.length === 1 && online[0].name !== curPc) pickPc(online[0].name);
}
function onPc(name) {   // 中继说「你现在看的是这台」：换了机器就把解码器和画布清掉，按新机器重来
  const changed = curPc !== null && curPc !== name;
  curPc = name;
  rememberPc(name);
  $('pc').value = name;
  if (changed) {
    closeDecoder(); synced = false; h264Proven = false; decErrors = 0; h264Mode = 'auto';
    cur = null; placeCursor(); monSig = '';
    ctx.clearRect(0, 0, cv.width, cv.height);
    clearLocal();                 // 按着的修饰键不要带到新机器上
    setOverlay('等待画面…');
  }
  sendConfig();          // 新机器上是它自己的默认设置，把页面上选的推过去
}
function pickPc(name) {
  if (!name || name === curPc) return;
  autoPick = false;
  setOverlay('切换电脑…');
  send({ t: 'pick', pc: name });
}
$('pc').onchange = () => pickPc($('pc').value);

// ---------- 屏幕切换：被控端每次有观众进来 / 切完屏都会广播显示器列表 {t:'mons', cur, list:[{i,x,y,w,h,primary}]}，
// 0 号是所有显示器拼成一张。只有一个显示器时不显示下拉框。所有观众看的是同一个屏，谁切了大家一起换 ----------
let monSig = '';
function setMonitors(m) {
  const sel = $('mon'), list = m.list || [];
  const sig = list.map(o => `${o.i}:${o.w}x${o.h}`).join(',');
  if (sig !== monSig) {          // 布局没变就只同步选中项，别在人家正打开下拉框时重建它
    monSig = sig;
    sel.innerHTML = '';
    const screens = list.filter(o => o.i > 0), all = list.find(o => o.i === 0);
    for (const o of screens) sel.add(new Option(`屏幕${o.i}${o.primary ? '(主)' : ''} ${o.w}×${o.h}`, o.i));
    if (all && screens.length > 1) sel.add(new Option(`全部屏幕 ${all.w}×${all.h}`, 0));
    sel.hidden = screens.length < 2;
  }
  sel.value = String(m.cur);
  if (overlay.textContent === '切换屏幕…' && sel.value !== pendingMon) setOverlay('');   // 切失败了（被控端回的还是原来那个）
}
let pendingMon = '';
$('mon').onchange = () => {
  pendingMon = $('mon').value;
  send({ t: 'mon', i: Number(pendingMon) });
  setOverlay('切换屏幕…');
};

// ---------- 画面：头 <HHhhHH> 宽 高 光标x 光标y flags 条带数；每条 <HHHHI> x y 宽 高 长度 + 数据 ----------
// flags bit0 = 关键帧，bit1 = 数据是 H.264（此时恒为一条，数据是一个 Annex B 访问单元）；否则每条是一块 JPEG
async function drawFrame(buf) {
  const dv = new DataView(buf);
  const w = dv.getUint16(0, true), h = dv.getUint16(2, true);
  const cx = dv.getInt16(4, true), cy = dv.getInt16(6, true);
  const flags = dv.getUint16(8, true), key = (flags & 1) === 1, h264 = (flags & 2) === 2, n = dv.getUint16(10, true);
  let off = 12;
  const strips = [];
  for (let i = 0; i < n; i++) {
    const x = dv.getUint16(off, true), y = dv.getUint16(off + 2, true), sw = dv.getUint16(off + 4, true), sh = dv.getUint16(off + 6, true);
    const len = dv.getUint32(off + 8, true);
    off += 12;
    strips.push({ x, y, sw, sh, off, len });
    off += len;
  }
  stats.frames++; stats.bytes += buf.byteLength; stats.strips += n;
  codecName = h264 ? 'H.264' : 'JPEG';
  if (h264) return drawH264(buf, w, h, cx, cy, key, strips[0]);
  if (dec) closeDecoder();
  if (key) synced = true;
  if (!synced) return;                       // 还没拿到整帧，增量帧没法叠，等（中继已替我们要了关键帧）
  if (cv.width !== w || cv.height !== h) {
    if (!key) { send({ t: 'kf' }); return; }
    resizeCanvas(w, h);
  }
  let bmps;
  try { bmps = await Promise.all(strips.map(s => createImageBitmap(new Blob([new Uint8Array(buf, s.off, s.len)], { type: 'image/jpeg' })))); }
  catch (_) { send({ t: 'kf' }); return; }
  strips.forEach((s, i) => { ctx.drawImage(bmps[i], s.x, s.y); bmps[i].close(); });
  cur = { x: cx, y: cy };
  placeCursor();
  clearWaiting();
}
function resizeCanvas(w, h) { cv.width = w; cv.height = h; cur = null; placeCursor(); }

// ---------- H.264：WebCodecs 硬解。被控端发的是 Annex B（起始码分隔，IDR 前带 SPS/PPS），

  const dt = Math.max(b.t - a.t, 8), vx = (b.x - a.x) / dt, vy = (b.y - a.y) / dt;

stage.addEventListener('touchstart', e => {

  if (e.touches.length >= 2) {

    if (tch) { cancelLP(); if (tch.drag) send({ t: 'up', b: 0 }); tch = null; edge = null; }
    const ids = [e.touches[0].identifier, e.touches[1].identifier], g = twoGeom(e, ids);
    two = { ids, sx: g.x, sy: g.y, sd: g.d, x: g.x, y: g.y, mode: null, axis: 'y', acc: 0, t0: performance.now() };

  if (on && zoom === 1) queueMove(norm(t.clientX, t.clientY));   // 没放大时手指落到哪光标跟到哪（放大后单指拖是挪画面，不动光标）

stage.addEventListener('touchmove', e => {

  if (two) { const g = twoGeom(e, two.ids); if (g) twoMove(g); return; }   // 双指松开一根后剩下那根不算数，等全松开
  if (!tch) return;
  const t = e.touches[0];
  trailAdd(t.clientX, t.clientY);
  if (!tch.moved) {
    if (Math.hypot(t.clientX - tch.x, t.clientY - tch.y) < 8) return;
    tch.moved = true; cancelLP();
    if (tch.lp) { flushMove(); send({ t: 'down', b: 0, ...norm(tch.x, tch.y) }); tch.drag = true; }
    else if (zoom > 1 || !tch.on) tch.pan = true;   // 放大后单指拖 = 挪画面（从黑边上拖起也算）
  }
  if (tch.pan) { panBy(t.clientX - tch.lx, t.clientY - tch.ly); tch.lx = t.clientX; tch.ly = t.clientY; return; }
  queueMove(norm(t.clientX, t.clientY));
  if (tch.drag) edgeAt(t.clientX, t.clientY, 44);
}, { passive: false });
const notch = (axis, s) => send(axis === 'x' ? { t: 'scroll', dx: -s, dy: 0 } : { t: 'scroll', dx: 0, dy: s });   // 手指往下滑 = 页面往下走（和真触屏一样），所以滚轮方向是反的
function twoMove(g) {
  const dx = g.x - two.x, dy = g.y - two.y;
  two.x = g.x; two.y = g.y;
  if (two.mode === 'zoom') {
    const p = stageXY(g.x, g.y), raw = two.z0 * g.d / Math.max(two.d0, 1);
    setView(raw >= 1 ? Math.min(MAXZ, raw) : Math.max(0.7, 1 - (1 - raw) * 0.35), p.x, p.y, two.u, two.v);   // 缩过 1× 有阻尼
    return;
  }
  // 判手势看两个量（都相对落指那一刻，单位 px）：两指间距变了多少 ds、两指中点挪了多少 dm。
  // ds 过 16 且不小于 dm = 在捏（一根不动另一根动的捏，ds 是 dm 的两倍；两指平行滑动 ds 几乎不变）；
  // dm 过 10 且大于 ds = 双指滑动。以前按间距的百分比判（6%），两指靠得近时晃 3px 就误判成捏合，
  // 一滑画面就跟着手指走还微微抖、页面死活滚不动。已经在滚的要 ds 过 40 才改判成捏；进了捏合就一直是捏合
  const ds = Math.abs(g.d - two.sd), dm = Math.hypot(g.x - two.sx, g.y - two.sy);
  if (two.mode ? ds > 40 : (ds > 16 && ds >= dm)) {
    cancelTwoTap();
    const p = stageXY(g.x, g.y);
    Object.assign(two, { mode: 'zoom', z0: zoom, d0: g.d }, contentAt(p.x, p.y));
    return;
  }
  if (!two.mode) {
    if (dm < 10 || ds >= dm) return;          // 才挪一点点 / 更像在捏：先别滚
    cancelTwoTap();                            // 刚才那下双指点只是手指弹了一下，不是要右键
    two.mode = 'scroll';
    two.axis = Math.abs(g.x - two.sx) > 2 * Math.abs(g.y - two.sy) ? 'x' : 'y';   // 只按主方向滚，免得手指稍微歪一点就横向乱滚
    two.acc = two.axis === 'x' ? g.x - two.sx : g.y - two.sy;                      // 死区里挪的那点也算上
    if (onCanvas(two.sx, two.sy)) { queueMove(norm(two.sx, two.sy)); flushMove(); }   // 光标先挪到手指底下：滚的就是手指底下那个窗口
  } else two.acc += two.axis === 'x' ? dx : dy;
  while (Math.abs(two.acc) >= NOTCH) { const s = Math.sign(two.acc); notch(two.axis, s); two.acc -= s * NOTCH; }
}
function twoEnd() {
  const g = two;
  two = null;
  if (!g.mode && performance.now() - g.t0 < 300) twoFingerTap(g.sx, g.sy);
  else if (g.mode === 'scroll' && Math.abs(g.acc) >= NOTCH / 2) notch(g.axis, Math.sign(g.acc));   // 轻轻一划不到一格也滚一下
  const p = stageXY(g.x, g.y);
  if (zoom < 1) animateZoom(1, p.x, p.y);                                // 捏过 1× 了：弹回去
  else if (g.mode === 'zoom' && zoom < 1.05) animateZoom(1, p.x, p.y);   // 捏完只比 1× 大一点点：吸回 1×，不然标着 1.0× 却还留在放大态
}
function twoFingerTap(x, y) {
  const now = performance.now();

    cancelTwoTap();
    const p = stageXY(x, y);
    animateZoom(zoom > 1.05 ? 1 : 2.5, p.x, p.y, 250);
    return;
  }
  // 双指点一下 = 在两指中间点右键；稍等一下看是不是连点两下（是的话就不发了）
  const on = onCanvas(x, y), p = norm(x, y);
  twoTap = { t: now, timer: setTimeout(() => { twoTap = null; if (on) { flushMove(); send({ t: 'click', b: 2, ...p }); releaseMods(); } }, TWO_TAP_MS) };

stage.addEventListener('touchend', e => {
  e.preventDefault(); lastTouchAt = performance.now();
  if (two) { if (!twoGeom(e, two.ids)) twoEnd(); return; }   // 记下的两根手指少了一根才算结束，第三根抬起不算
  if (!tch) return;
  cancelLP(); flushMove(); edge = null;
  if (tch.drag) { send({ t: 'up', b: 0 }); releaseMods(); }
  else if (tch.pan) flingFromTrail();
  else if (tch.on && tch.lp) { send({ t: 'click', b: 2, ...norm(tch.x, tch.y) }); releaseMods(); }
  else if (tch.on && !tch.moved) { tap(tch.x, tch.y); releaseMods(); }
  tch = null;

// Windows 要两下落在 4 像素以内才认双击；手机上画面缩着看，手指偏 1 个 CSS 像素到被控端就是好几个像素，
// 双击文件夹老是变成两次单击。两下点得够快（450ms）够近（24px）就把第二下对齐到第一下的坐标
let lastTap = null;
function tap(x, y) {
  const now = performance.now();
  const p = lastTap && now - lastTap.t < 450 && Math.hypot(x - lastTap.x, y - lastTap.y) < 24 ? lastTap.p : norm(x, y);
  lastTap = { t: now, x, y, p };

  lastTouchAt = performance.now(); edge = null; trail.length = 0;

  two = null;
  if (zoom < 1) { const g = geom(); animateZoom(1, g.SW / 2, g.SH / 2); }

// ---------- 键盘 ----------
// 特殊键 / 带 Ctrl、Alt、Win 的组合走 keydown/keyup；普通字符（含中文输入法）走文本框的 input 事件，
// 这样手机软键盘和桌面输入法都能用。
function resetKb() { kb.value = SENT; }
function focusKb() {
  resetKb();
  if (document.activeElement === kb) kb.blur();   // 已经聚焦时 focus() 是空操作，安卓收起键盘后就再也弹不出来；先松开再抓
  kb.focus({ preventScroll: true });
}
// 手机软键盘只在点 ⌨ 时弹。安卓 Chrome 每处理完一次「点一下」都会看一眼：焦点在输入框上，就把软键盘顶出来——
// 用返回键收起键盘时输入框并不失焦，于是之后每点一下画面、工具栏，键盘就又弹出来（光拦幽灵鼠标事件拦不住这个）。
// 所以输入框平时是 inputmode="none"：有焦点也不弹软键盘；点 ⌨ 才临时换成 text，键盘一收起就换回去、顺手松开焦点。
// 键盘开没开由这里自己记（kbWanted），不再拿 innerHeight 和可视区高度差去猜——弹键盘时整页一起变矮的浏览器
// （比如微信里）那个差一直是 0，⌨ 就永远判成「没开」、收不起来。只对手指当主要指点设备的手机平板这么做，电脑输入法不受影响
const SOFT_KB = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
const vv = window.visualViewport;
const kbBtn = bar.querySelector('[data-act="kb"]');
let kbWanted = false, kbSeen = false;
if (SOFT_KB) kb.setAttribute('inputmode', 'none');
function openKb() {
  kb.blur();                                   // 已经聚焦时 focus() 是空操作，先松开；这时 kbWanted 还是 false，下面的 blur 监听不会误关
  kbWanted = true; kbSeen = false;
  if (SOFT_KB) kb.setAttribute('inputmode', 'text');
  resetKb();
  kb.focus({ preventScroll: true });
  kbBtn.classList.add('on');
}
function closeKb() {
  kbWanted = false; kbSeen = false;
  if (SOFT_KB) kb.setAttribute('inputmode', 'none');
  kb.blur();
  kbBtn.classList.remove('on');
}
// ⌨ 看实际情况：键盘真开着才收；焦点已经丢了、或者看得出键盘已经被收起（没收到通知的情况），就当没开、直接打开
const kbShown = () => document.activeElement === kb && !(kbSeen && vv && vv.height > vvBase - 60);
function toggleKb() { if (kbWanted && kbShown()) closeKb(); else openKb(); }
kb.addEventListener('blur', () => { if (kbWanted) closeKb(); });   // iOS 点「完成」、焦点被下拉框拿走：键盘已经没了
// 安卓返回键收起键盘不会让输入框失焦，只能看可视区高度：键盘开着时比平时矮一大截，又恢复原高就是被收起了
let vvBase = vv ? vv.height : 0, vvW = vv ? vv.width : 0;
if (vv) vv.addEventListener('resize', () => {
  if (Math.abs(vv.width - vvW) > 1) { vvW = vv.width; vvBase = vv.height; kbSeen = false; return; }   // 转屏：重新记平时的高度
  if (!kbWanted) { vvBase = Math.max(vvBase, vv.height); return; }
  if (vv.height < vvBase - 120) kbSeen = true;                  // 键盘确实弹出来了
  else if (kbSeen && vv.height > vvBase - 60) closeKb();        // 弹出来过、现在又恢复原高：被返回键收起了

const MODKEYS = [['ctrlKey', 'Control'], ['altKey', 'Alt'], ['shiftKey', 'Shift'], ['metaKey', 'Meta']];

  for (const [prop, k] of MODKEYS) {
    if (e[prop] && !pressed.has(k) && !mods.has(k)) { send({ t: 'key', k, d: 1 }); pressed.add(k); }

  }

  if (e.isComposing || e.key === 'Process' || e.key === 'Unidentified') return;

  if (!(special || e.ctrlKey || e.altKey || e.metaKey)) return;
  e.preventDefault();
  if (e.repeat || pressed.has(e.key)) return;   // 长按自动重复交给被控端的系统去做

  syncMods(e);
  if (!pressed.has(e.key)) return;

function flushText(inputType) {
  const raw = kb.value;
  const v = raw.startsWith(SENT) ? raw.slice(SENT.length) : raw;

  if (v) {
    const parts = v.split('\n');
    parts.forEach((p, i) => { if (p) send({ t: 'text', s: p }); if (i < parts.length - 1) tapKey('Enter'); });
    releaseMods();
  }
  resetKb();
}
function tapKey(k) { send({ t: 'key', k, d: 1 }); send({ t: 'key', k, d: 0 }); releaseMods(); }

// ---------- 工具栏 ----------
bar.addEventListener('pointerdown', e => { if (e.target.tagName !== 'SELECT') e.preventDefault(); });  // 别把焦点从输入框抢走
bar.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.act === 'kb') toggleKb();
  else if (b.dataset.act === 'fs') toggleFullscreen();
  else if (b.dataset.act === 'zi') zoomStep(1.25);
  else if (b.dataset.act === 'zo') zoomStep(1 / 1.25);
  else if (b.dataset.act === 'zr') zoomStep(1 / (anim ? animTo : zoom));
  else if (b.dataset.key) tapKey(b.dataset.key);
  else if (b.dataset.mod) toggleMod(b.dataset.mod, b);

async function toggleFullscreen() {
  if (document.fullscreenElement) { document.exitFullscreen(); return; }

  // 发给被控端（退出全屏改成按住 Esc）。别的浏览器没有这个接口，照旧
  if (navigator.keyboard && navigator.keyboard.lock) navigator.keyboard.lock().catch(() => { /* 不支持就算了 */ });

// 不全屏时 Ctrl+W / Ctrl+F4 / Alt+F4 页面拦不住（浏览器保留键）：本想关被控端的标签页，却把这个页面关了。
// 刚按着 Ctrl / Alt 就要离开页面时让浏览器弹一下「确定离开？」；平常刷新、关页面不受影响
let modAt = -1e9;

function toggleMod(k, btn) {
  if (mods.has(k)) { mods.delete(k); send({ t: 'key', k, d: 0 }); btn.classList.remove('on'); }
  else { mods.add(k); send({ t: 'key', k, d: 1 }); btn.classList.add('on'); }
}
function releaseMods() {
  for (const k of mods) send({ t: 'key', k, d: 0 });
  mods.clear();
  bar.querySelectorAll('button[data-mod].on').forEach(b => b.classList.remove('on'));
}
function clearLocal() { pressed.clear(); mods.clear(); bar.querySelectorAll('button[data-mod].on').forEach(b => b.classList.remove('on')); }
function releaseAll() { send({ t: 'release' }); clearLocal(); }
window.addEventListener('blur', releaseAll);   // 切到后台时的松键在上面「连接」那段的 visibilitychange 里

// ---------- 状态栏 ----------
setInterval(() => {
  const now = performance.now(), dt = (now - stats.t) / 1000;
  const parts = [`${(stats.frames / dt).toFixed(1)}fps`, `${(stats.bytes / 1024 / dt).toFixed(0)}KB/s`];
  if (stats.rtt != null) parts.push(`${stats.rtt}ms`);
  if (cv.width > 16) parts.push(`${cv.width}×${cv.height}`);
  if (codecName) parts.push(codecName);
  st.textContent = parts.join(' · ');
  stats.frames = 0; stats.bytes = 0; stats.strips = 0; stats.t = now;
}, 2000);
setInterval(() => send({ t: 'ping', ts: performance.now() }), 2000);

resetKb();
connect();
if (!('ontouchstart' in window)) focusKb();   // 电脑上打开就能直接打字；手机上等点键盘按钮再弹
})();
</script>
</body>
