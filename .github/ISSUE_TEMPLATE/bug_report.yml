name: Bug report
description: Report a reproducible WebRC problem without private data.
body:
  - type: markdown
    attributes:
      value: |
        Remove credentials and personal data from logs/screenshots. Report vulnerabilities privately via SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest sequence needed to reproduce the issue.
      placeholder: |
        1. Start ...
        2. Connect ...
        3. Select ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Windows/Python/browser/capture/codec/ffmpeg/monitor/relay context from CONTRIBUTING.md.
      placeholder: |
        Windows:
        Python:
        Browser:
        Capture:
        Codec:
        ffmpeg/encoder:
        Monitor:
        Relay OS and TLS:
    validations:
      required: true
